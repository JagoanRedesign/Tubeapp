name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate debug.keystore & Build APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out _p

          # 1. Buat debug.keystore jika belum tersedia di runner
          KEYSTORE_DIR="$HOME/.config/.android"
          KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "===== Membuat debug.keystore baru ====="
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Fungsi helper untuk build per root project Android
          build_android_project() {
            local ROOT_DIR="$1"
            local OUT_NAME="$2"

            if [ ! -f "$ROOT_DIR/app/build.gradle" ] && [ ! -f "$ROOT_DIR/app/build.gradle.kts" ]; then
              echo "::error::app/build.gradle(.kts) tidak ditemukan di $ROOT_DIR"
              exit 1
            fi

            echo "===== Signing Report ($OUT_NAME) ====="
            (cd "$ROOT_DIR" && gradle --no-daemon signingReport) | grep -E "Variant:|Store:|Alias:|SHA1:|SHA-256:|MD5:" || true

            echo "===== Assemble Debug APK ($OUT_NAME) ====="
            (cd "$ROOT_DIR" && gradle --no-daemon --stacktrace assembleDebug)

            APK="$(find "$ROOT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
            if [ -z "$APK" ]; then
              echo "::error::APK debug tidak ditemukan untuk $OUT_NAME"
              exit 1
            fi

            cp "$APK" "out/$OUT_NAME.apk"

            echo "===== SHA1 dari APK (out/$OUT_NAME.apk) ====="
            keytool -printcert -jarfile "out/$OUT_NAME.apk" | grep -iE "Owner:|Issuer:|Serial number:|Valid from:|SHA1:|SHA256:" || true
          }

          # 2. Cek apakah ada file .zip proyek di root repo
          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -name '*.zip' -print | sort)

          if [ "${#ZIP_FILES[@]}" -gt 0 ]; then
            for Z in "${ZIP_FILES[@]}"; do
              N="$(basename "$Z" .zip)"
              DEST="_p/$N"
              mkdir -p "$DEST"
              unzip -oq "$Z" -d "$DEST"

              SETTINGS="$(find "$DEST" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
              if [ -z "$SETTINGS" ]; then
                echo "::error::settings.gradle(.kts) tidak ditemukan di $Z"
                exit 1
              fi

              build_android_project "$(dirname "$SETTINGS")" "$N"
            done
          else
            SETTINGS="$(find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path './.gradle/*' -not -path './_p/*' -print -quit)"
            if [ -z "$SETTINGS" ]; then
              echo "::error::settings.gradle(.kts) tidak ditemukan"
              exit 1
            fi

            build_android_project "$(dirname "$SETTINGS")" "app"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaTube-APK
          path: out/*.apk
          if-no-files-found: error
