name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK dari ZIP atau proyek langsung
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out _p

          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -name '*.zip' -print | sort)

          if [ "${#ZIP_FILES[@]}" -gt 0 ]; then
            for Z in "${ZIP_FILES[@]}"; do
              N="$(basename "$Z" .zip)"
              DEST="_p/$N"
              mkdir -p "$DEST"
              unzip -oq "$Z" -d "$DEST"

              SETTINGS="$(find "$DEST" -type f -name 'settings.gradle.kts' -print -quit)"
              if [ -z "$SETTINGS" ]; then
                echo "::error::settings.gradle(.kts) tidak ditemukan di $Z"
                exit 1
              fi
              ROOT="$(dirname "$SETTINGS")"

              if [ ! -f "$ROOT/app/build.gradle" ] && [ ! -f "$ROOT/app/build.gradle.kts" ]; then
                echo "::error::app/build.gradle(.kts) tidak ditemukan di $ROOT"
                exit 1
              fi

              (cd "$ROOT" && gradle --no-daemon --stacktrace assembleDebug)
              APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
              if [ -z "$APK" ]; then
                echo "::error::APK debug tidak ditemukan untuk $N"
                exit 1
              fi
              cp "$APK" "out/$N.apk"
            done
          else
            SETTINGS="$(find . -type f -name 'settings.gradle.kts' -not -path './.gradle/*' -print -quit)"
            if [ -z "$SETTINGS" ]; then
              echo "::error::settings.gradle(.kts) tidak ditemukan"
              exit 1
            fi
            ROOT="$(dirname "$SETTINGS")"
            (cd "$ROOT" && gradle --no-daemon --stacktrace assembleDebug)
            APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
            if [ -z "$APK" ]; then
              echo "::error::APK debug tidak ditemukan"
              exit 1
            fi
            cp "$APK" out/app.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaTube-APK
          path: out/*.apk
          if-no-files-found: error
