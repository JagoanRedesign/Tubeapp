name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build semua proyek (zip di root repo, atau proyek langsung di root)
        run: |
          mkdir -p out
          if ls *.zip >/dev/null 2>&1; then
            for Z in *.zip; do
              N=$(basename "$Z" .zip)
              mkdir -p "_p/$N" && unzip -q "$Z" -d "_p/$N"
              ROOT=$(dirname "$(find "_p/$N" -name settings.gradle.kts | head -n 1)")
              (cd "$ROOT" && gradle assembleDebug --no-daemon)
              cp "$ROOT"/app/build/outputs/apk/debug/*.apk "out/$N.apk"
            done
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk out/app.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: out/*.apk
